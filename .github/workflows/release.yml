name: Release

# Push a tag like v0.1.0 and this workflow publishes a GitHub release.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(jq -r '.version' custom_components/local_disk_backup/manifest.json)"
          echo "Tag: ${TAG_VERSION}  Manifest: ${MANIFEST_VERSION}"
          if [ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${MANIFEST_VERSION}. Bump the version, commit, and re-tag."
            exit 1
          fi

      - name: Validate JSON files
        run: |
          for f in hacs.json \
                   custom_components/local_disk_backup/manifest.json \
                   custom_components/local_disk_backup/strings.json \
                   custom_components/local_disk_backup/translations/en.json; do
            jq empty "$f"
          done

      - name: Check Python syntax
        run: python3 -m compileall -q custom_components/local_disk_backup

      - name: Build release zip
        run: |
          cd custom_components/local_disk_backup
          zip -r ../../local_disk_backup.zip . -x '*__pycache__*' -x '*.pyc'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" local_disk_backup.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
